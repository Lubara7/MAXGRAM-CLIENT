name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - name: Unit tests, lint, both backends and device-test compilation
        run: >-
          ./gradlew --no-daemon
          :core:domain:test
          :core:data:testDemoDebugUnitTest
          :core:data:testProductionDebugUnitTest
          :core:localization:testDebugUnitTest
          :feature:auth:testDebugUnitTest
          :app:lintDemoDebug :app:lintProductionDebug
          :app:assembleDemoDebug :app:assembleProductionDebug
          :core:data:assembleDemoDebugAndroidTest
      - name: Upload debug APKs
        uses: actions/upload-artifact@v6
        with:
          name: tgmax-debug-apks
          path: app/build/outputs/apk/**/debug/*.apk
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verification-reports
          path: |
            **/build/reports/tests/
            app/build/reports/lint-results-*.html
