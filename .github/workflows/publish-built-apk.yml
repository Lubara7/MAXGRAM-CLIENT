name: Publish built APK
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful APK build artifact run
        required: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      TGMAX_ALPHA_KEYSTORE: /tmp/tgmax-signing/debug.keystore
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache/restore@v4
        id: alpha-key
        with:
          path: ${{ env.TGMAX_ALPHA_KEYSTORE }}
          key: tgmax-alpha-debug-keystore-v2
      - name: Prepare alpha signing key
        run: |
          mkdir -p "$(dirname "$TGMAX_ALPHA_KEYSTORE")"
          if [ ! -s "$TGMAX_ALPHA_KEYSTORE" ]; then
            keytool -genkeypair -keystore "$TGMAX_ALPHA_KEYSTORE" -storetype PKCS12 -alias androiddebugkey -storepass android -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
      - uses: actions/cache/save@v4
        if: steps.alpha-key.outputs.cache-hit != 'true'
        with:
          path: ${{ env.TGMAX_ALPHA_KEYSTORE }}
          key: tgmax-alpha-debug-keystore-v2
      - uses: actions/download-artifact@v6
        with:
          name: tgmax-telegram-apk
          path: dist
          run-id: ${{ env.BUILD_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Verify original artifacts
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS.txt
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install signing tools
        run: sdkmanager 'build-tools;36.0.0'
      - name: Sign and verify built APK
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          out = pathlib.Path('dist')
          apk, = out.glob('*.apk')
          release = json.load(open('release.json'))
          tools = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools/36.0.0'
          identity = subprocess.check_output([str(tools/'aapt'), 'dump', 'badging', str(apk)], text=True)
          assert "name='io.github.lubara7.tgmax'" in identity
          assert "versionName='" + release['version'] + "'" in identity
          signed = apk.with_suffix('.signed')
          subprocess.run([str(tools/'apksigner'), 'sign', '--ks', os.environ['TGMAX_ALPHA_KEYSTORE'], '--ks-key-alias', 'androiddebugkey', '--ks-pass', 'pass:android', '--key-pass', 'pass:android', '--out', str(signed), str(apk)], check=True)
          signed.replace(apk)
          report = subprocess.check_output([str(tools/'apksigner'), 'verify', '--verbose', '--print-certs', str(apk)], text=True)
          (out/'signature-verification.txt').write_text(report)
          source, = out.glob('*-source.tar.gz')
          (out/'SHA256SUMS.txt').write_text(''.join(hashlib.file_digest(p.open('rb'),'sha256').hexdigest() + '  ' + p.name + '\n' for p in [apk,source]))
          PY
      - name: Publish verified alpha APK
        run: |
          tag=$(jq -r .tag release.json)
          source_commit=$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" --jq .head_sha)
          git fetch --no-tags --depth 1 origin "$source_commit"
          git diff --exit-code "$source_commit" "$GITHUB_SHA" -- . ':(exclude).github/workflows'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.apk dist/SHA256SUMS.txt dist/signature-verification.txt dist/*-source.tar.gz --clobber
            gh release edit "$tag" --notes-file docs/release-notes.md
          else
            gh release create "$tag" dist/*.apk dist/SHA256SUMS.txt dist/signature-verification.txt dist/*-source.tar.gz --target "$GITHUB_SHA" --prerelease --title "MAXGRAM CLIENT $tag" --notes-file docs/release-notes.md
          fi
