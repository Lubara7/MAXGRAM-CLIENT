name: Install published APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/apk-smoke.yml', 'scripts/check_phone_ui.py', 'scripts/ExtractCodecDex.java', 'scripts/CodecDeviceSmoke.java']
  workflow_run:
    workflows: ["Nagram APK release", "Publish built APK"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  phone-screen:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[release]')) || (github.event.workflow_run.conclusion == 'success' && (contains(github.event.workflow_run.head_commit.message, '[release]') || github.event.workflow_run.name == 'Publish built APK'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Download and verify the published APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(jq -r .tag release.json)
          gh release download "$tag" -p '*.apk' -p SHA256SUMS.txt -p signature-verification.txt
          awk '$2 ~ /\.apk$/ {print}' SHA256SUMS.txt | sha256sum --check --strict
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/tgmax-signing/debug.keystore
          key: tgmax-alpha-debug-keystore-v2
      - name: Verify the saved alpha signing certificate
        run: |
          keytool -exportcert -keystore /tmp/tgmax-signing/debug.keystore -alias androiddebugkey -storepass android -file alpha-certificate.der
          python3 - <<'PYCODE'
          import hashlib, pathlib, re
          certificate = pathlib.Path('alpha-certificate.der').read_bytes()
          report = pathlib.Path('signature-verification.txt').read_text()
          expected = re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]+)', report)[1].lower()
          assert hashlib.sha256(certificate).hexdigest() == expected
          print('Published APK matches the saved alpha signing key')
          PYCODE
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Prepare Android protocol fixture check
        run: |
          mkdir -p codec-classes codec-tools codec-libs
          curl --fail --silent --show-error --location https://repo.maven.apache.org/maven2/org/smali/dexlib2/2.5.2/dexlib2-2.5.2.jar -o codec-libs/dexlib2.jar
          curl --fail --silent --show-error --location https://repo.maven.apache.org/maven2/org/smali/util/2.5.2/util-2.5.2.jar -o codec-libs/util.jar
          curl --fail --silent --show-error --location https://repo.maven.apache.org/maven2/com/google/guava/guava/27.1-android/guava-27.1-android.jar -o codec-libs/guava.jar
          curl --fail --silent --show-error --location https://repo.maven.apache.org/maven2/com/google/code/findbugs/jsr305/3.0.2/jsr305-3.0.2.jar -o codec-libs/jsr305.jar
          javac -cp 'codec-libs/*' -d codec-tools scripts/ExtractCodecDex.java
          java -Xmx2g -cp 'codec-tools:codec-libs/*' ExtractCodecDex ./*.apk codec-library.dex
          javac -source 8 -target 8 -d codec-classes scripts/CodecDeviceSmoke.java
          "$ANDROID_HOME/build-tools/36.0.0/d8" --min-api 27 --output codec-smoke.zip codec-classes/CodecDeviceSmoke.class codec-library.dex
      - name: Allow emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare phone-screen check
        run: |
          cat > smoke-phone.sh <<'SCRIPT'
          set -euo pipefail
          pkg=io.github.lubara7.tgmax
          adb shell getprop ro.product.cpu.abilist | grep -F arm64-v8a
          adb install -g ./*.apk
          adb push codec-smoke.zip /data/local/tmp/codec-smoke.zip
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          activity=$(adb shell cmd package resolve-activity --brief "$pkg" | tail -n1 | tr -d '\r')
          adb shell am start -W -n "$activity"
          codec_status=0
          adb shell 'CLASSPATH=/data/local/tmp/codec-smoke.zip app_process -Xmx192m /data/local/tmp CodecDeviceSmoke' > codec-smoke.txt 2>&1 || codec_status=$?
          cat codec-smoke.txt
          python3 scripts/check_phone_ui.py
          test "$codec_status" -eq 0
          SCRIPT
      - name: Install and open phone login
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          script: bash "$GITHUB_WORKSPACE/smoke-phone.sh"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: phone-login-ui
          path: |
            codec-smoke.txt
            login.xml
            login*.png
            languages.png
            languages.xml
            localized-login.xml
            login-country.xml
            countries.xml
            countries.png
            startup-logcat.txt
            activity-state.txt
            failure.png
            anr-traces/
