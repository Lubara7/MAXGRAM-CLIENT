name: Inspect Komet Android evidence

on:
  push:
    branches: [komet-telegram-ui]
    paths: ['.github/workflows/komet-evidence.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[inspect-komet]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Download verified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 44924690580 --name komet-preview-files --dir dist
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: python3 scripts/smoke_komet_preview.py --artifacts dist --output evidence
      - name: Read saved emulator evidence
        if: always()
        run: |
          python3 - <<'PY'
          import base64,json
          from pathlib import Path
          for name in ['phone-keyboard.png','login.png']:
              path=Path('evidence')/name
              if path.exists(): print('MAXGRAM_IMAGE:'+name+':'+base64.b64encode(path.read_bytes()).decode())
          for name in ['window-keyboard.txt','input-method.txt','startup.json']:
              path=Path('evidence')/name
              if path.exists():
                  print('MAXGRAM_DUMP:'+name)
                  print(path.read_text())
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: komet-keyboard-diagnostics
          path: evidence/
