name: Telegram design verification

on:
  push:
    branches: [telegram-android-design]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: git submodule update --init upstream/komet-ui
      - run: python3 scripts/prepare_komet_client.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          cache: true
      - name: Resolve public Flutter packages
        working-directory: build/komet-client
        run: flutter pub get
      - name: Export only resolved public package sources
        run: |
          python3 - <<'PY'
          import json,tarfile
          from pathlib import Path
          from urllib.parse import urlparse
          cache=Path.home()/'.pub-cache'
          config=json.loads(Path('build/komet-client/.dart_tool/package_config.json').read_text())
          packages=[]
          with tarfile.open('komet-public-flutter-packages.tar.gz','w:gz') as archive:
              for package in config['packages']:
                  source=Path(urlparse(package['rootUri']).path)
                  if source.is_dir() and source.is_relative_to(cache/'hosted/pub.dev'):
                      relative=source.relative_to(cache)
                      archive.add(source,arcname=str(relative))
                      packages.append(package['name'])
          print(json.dumps({'publicPackageCount':len(packages),'archiveBytes':Path('komet-public-flutter-packages.tar.gz').stat().st_size}))
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: komet-public-flutter-packages
          path: komet-public-flutter-packages.tar.gz
          retention-days: 3
